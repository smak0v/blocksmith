[package]
name = "blocksmith"
version = "0.1.0"
edition = "2024"

[dependencies]
libp2p = { version = "0.56.0", features = ["tcp", "tls", "mdns", "gossipsub", "tokio", "macros", "noise", "yamux"] }
tokio = { version = "1.48.0", features = ["sync", "macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
serde = { version = "1.0.228", features = ["derive"] }
tracing-bunyan-formatter = "0.3.10"
derive-getters = "0.5.0"
serde_json = "1.0.145"
tracing-log = "0.2.0"
anyhow = "1.0.100"
tracing = "0.1.41"
chrono = "0.4.42"
sha2 = "0.10.9"
hex = "0.4.3"
